services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Redis holds the security certificate. It had NO volume, so a host restart
    # during verification lost project 201's certificate while Postgres still
    # said the project was `secured` — the two stores disagreed and the
    # disagreement resolved unsafely. appendonly (AOF) rather than the default
    # RDB snapshots: snapshotting is exactly what dropped the writes, since
    # everything since the last snapshot is lost on an ungraceful kill.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      YELP_API_KEY: ${YELP_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Scoped platform vision key for menu PDF extraction (Week 10). DevOps
      # injects it only into deployed apps that shipped the PDF menu feature.
      MENU_EXTRACTION_API_KEY: ${MENU_EXTRACTION_API_KEY:-}
      CODEGEN_MODE: ${CODEGEN_MODE:-real}
      # Paid Opus security review. Default ON. Set false during a LOCAL codegen /
      # feature-debug phase to drop each iteration from ~$3 to ~$1; ignored for an
      # AWS deploy and the deploy is honestly marked NOT security-certified.
      SECURITY_REVIEW_ENABLED: ${SECURITY_REVIEW_ENABLED:-true}
      # Step 5 verification: run a real `next build` against generated frontend
      # code instead of the cheap syntax-only check. Off by default — a full
      # build downloads a node toolchain and is slow.
      QA_FRONTEND_FULL_BUILD: ${QA_FRONTEND_FULL_BUILD:-false}
      # ---- Week 7 DevOps ----
      # "local" (default) builds+runs REAL containers on the host daemon (the
      # socket below); "aws" is the real EC2 path (boto3 uses the mounted creds).
      DEPLOY_TARGET: ${DEPLOY_TARGET:-local}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-rajkumarai.dev}
      APPS_SUBDOMAIN: ${APPS_SUBDOMAIN:-apps.rajkumarai.dev}
      ROUTE53_ZONE_ID: ${ROUTE53_ZONE_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-2}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # Fernet key that encrypts secret VALUES at rest. Absent -> the secrets
      # store refuses to hold plaintext (it never silently downgrades).
      SECRETS_ENC_KEY: ${SECRETS_ENC_KEY:-}
    volumes:
      # DevOps builds the generated app's images and runs its containers on the
      # HOST Docker daemon (docker-out-of-docker). Config is baked into images and
      # data uses named volumes, so there are no host bind-mounts to resolve.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only AWS credentials for the boto3 AWS deploy driver. Only used when
      # DEPLOY_TARGET=aws; harmless otherwise.
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
